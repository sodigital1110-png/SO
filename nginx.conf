server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve Next.js static assets with long cache
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ =404;
    }

    # Serve other static assets (images, videos, fonts, etc.)
    location ~* \.(webp|avif|png|jpg|jpeg|gif|svg|ico|mp4|mov|woff|woff2|ttf|eot|glb|gltf)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri $uri/ =404;
    }

    # SPA / Next.js page routing — try HTML file first, then index
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
